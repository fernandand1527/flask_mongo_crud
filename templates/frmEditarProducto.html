<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar producto</title>
  <!-- Estilos propios -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Encabezado -->
  {% include 'encabezado.html' %}

  <div class="container mt-4">
    <h1 class="text-center">Editar producto</h1>

    <form action="{{ url_for('actualizarProducto') }}" method="POST" class="mt-3">
      <!-- Campo oculto con el id -->
      <input type="hidden" name="id" value="{{ producto['_id'] }}">

      <div class="mb-3">
        <label class="form-label">Código:</label>
        <input type="text" name="codigo" value="{{ producto['código'] }}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Nombre:</label>
        <input type="text" name="nombre" value="{{ producto['nombre'] }}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Precio:</label>
        <input type="number" step="0.01" name="precio" value="{{ producto['precio'] }}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Categoría:</label>
        <input type="text" name="categoria" value="{{ producto['categoría'] }}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Foto:</label>
        <input type="text" name="foto" value="{{ producto['foto'] }}" class="form-control">
      </div>

      <div class="d-flex justify-content-between">
        <a href="{{ url_for('listarProductos') }}" class="btn btn-secondary">⬅️ Volver</a>
        <button type="submit" class="btn btn-primary">💾 Guardar cambios</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  {% include 'footer.html' %}
</body>
</html>
